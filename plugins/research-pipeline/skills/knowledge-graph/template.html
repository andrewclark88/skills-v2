<!doctype html><html><head><meta charset="utf-8"><title>knowledge graph — __ROOT__</title>
<script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/layout-base@2.0.1/layout-base.js"></script>
<script src="https://unpkg.com/cose-base@2.2.0/cose-base.js"></script>
<script src="https://unpkg.com/cytoscape-fcose@2.2.0/cytoscape-fcose.js"></script>
<style>
 body{margin:0;font:13px -apple-system,system-ui,sans-serif;background:#11151c;color:#cdd6e0}
 #bar{padding:8px 12px;background:#0b0e13;border-bottom:1px solid #222;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
 #bar b{color:#fff} .stat{color:#8b98a8} .stat b{color:#fff} .warn b{color:#ff9f1c} .bad b{color:#ff5b73} .ok b{color:#5fd07a}
 button,select{background:#1c222c;color:#cdd6e0;border:1px solid #333;border-radius:5px;padding:4px 8px;font-size:12px;cursor:pointer}
 button.active{background:#2d6cdf;border-color:#2d6cdf;color:#fff}
 #legend{padding:6px 12px;background:#0b0e13;border-bottom:1px solid #222;font-size:11px;line-height:1.9}
 .lg{margin-right:12px;white-space:nowrap} .lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
 #cy{position:absolute;top:84px;bottom:0;left:0;right:340px}
 #qa{position:absolute;top:84px;bottom:0;right:0;width:340px;background:#0b0e13;border-left:1px solid #222;overflow:auto;padding:10px 12px;font-size:12px}
 #qa h3{margin:12px 0 4px;font-size:12px;color:#fff} #qa h3 span{font-weight:400;color:#8b98a8}
 #qa .item{padding:2px 6px;border-radius:4px;cursor:pointer;color:#aab;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 #qa .item:hover{background:#1c222c;color:#fff} #qa .ok{color:#5fd07a} #qa .sub{color:#6b7686;font-size:11px;margin:4px 0 1px}
 #tip{position:absolute;max-width:320px;background:#000e;border:1px solid #444;border-radius:6px;padding:8px 10px;font-size:12px;pointer-events:none;display:none;z-index:9}
 #tip .t{color:#fff;font-weight:600} #tip .m{color:#9fb;font-size:11px;margin:2px 0} #tip .s{color:#aab;margin-top:4px}
</style></head><body>
<div id="bar"><b>knowledge graph</b>
 <span class="stat"><b>__N__</b> docs · <b>__RE__</b> related · <b>__CE__</b> containment · <b>__G__</b> groups</span>
 <span class="stat __UCLS__">QA: <b>__U__</b> unindexed</span>
 <span class="stat __BCLS__"><b>__B__</b> broken</span>
 <span class="stat"><b>__OOS__</b> out-of-scope · <b>__O__</b> orphans · <b>__SUP__</b> superseded</span>
 <span style="flex:1"></span>
 <select id="grp"><option value="">all groups</option>__GOPTS__</select>
 <button id="bLens">edges: both</button>
 <button id="bUx">unindexed</button><button id="bBx">broken</button>
 <button id="bOrphan">orphans</button><button id="bSup">superseded</button>
 <button id="bFit">fit</button><button id="bRelayout">relayout</button>
</div>
<div id="legend">__LEGEND__</div>
<div id="cy"></div><div id="qa"></div><div id="tip"></div>
<script>
const DATA = __DATA__;
const cy = cytoscape({container:document.getElementById('cy'),
  elements:{nodes:DATA.nodes,edges:DATA.edges},
  style:[
    {selector:'node',style:{'background-color':'data(color)','width':'mapData(deg,0,40,8,46)','height':'mapData(deg,0,40,8,46)'}},
    {selector:'node[?nav]',style:{'border-width':2,'border-color':'#fff'}},
    {selector:'node[?ghost]',style:{'shape':'diamond'}},
    {selector:'edge[ekind="related"]',style:{'width':0.6,'line-color':'#33405a','curve-style':'haystack','opacity':0.5}},
    {selector:'edge[ekind="containment"]',style:{'width':0.8,'line-color':'#2f5d50','curve-style':'haystack','opacity':0.55}},
    {selector:'edge[dclass="unindexed"]',style:{'line-color':'#ff9f1c','opacity':0.9,'width':1.3}},
    {selector:'edge[dclass="broken"]',style:{'line-color':'#ff0033','opacity':0.95,'width':1.6}},
    {selector:'edge[dclass="out-of-scope"]',style:{'line-color':'#555','opacity':0.4,'line-style':'dashed'}},
    {selector:'.hl',style:{'background-color':'#ffd84d','border-width':3,'border-color':'#ffd84d','z-index':99}},
    {selector:'.dim',style:{'opacity':0.06}},
    {selector:'.sel',style:{'border-width':3,'border-color':'#2d6cdf','z-index':99}},
    {selector:'edge.inc',style:{'line-color':'#2d6cdf','opacity':1,'width':1.6,'z-index':99}},
    {selector:'.ehide',style:{'display':'none'}},
  ]});
function layout(){cy.layout({name:'fcose',animate:false,nodeSeparation:75,idealEdgeLength:55,nodeRepulsion:8000,packComponents:true}).run();}
layout(); cy.fit(undefined,30);
const tip=document.getElementById('tip');
cy.on('mouseover','node',e=>{const d=e.target.data();tip.style.display='block';
 tip.innerHTML='<div class="t">'+d.label+'</div><div class="m">'+d.group+' · '+d.type+' · deg '+d.deg+'</div>'+(d.summary?'<div class="s">'+d.summary+'</div>':'');});
cy.on('mousemove',e=>{tip.style.left=Math.min(e.renderedPosition.x+16,window.innerWidth-360)+'px';tip.style.top=(e.renderedPosition.y+16)+'px';});
cy.on('mouseout','node',()=>tip.style.display='none');
function focus(id){const n=cy.getElementById(id);if(!n.length)return;cy.elements().removeClass('sel inc dim hl');
 cy.elements().addClass('dim');n.removeClass('dim').addClass('sel');n.neighborhood().removeClass('dim');n.connectedEdges().addClass('inc');cy.animate({center:{eles:n},zoom:1.4},{duration:300});}
cy.on('tap','node',e=>focus(e.target.id()));
cy.on('tap',e=>{if(e.target===cy)cy.elements().removeClass('sel inc dim hl');});
function tog(btn,fn){const on=btn.classList.toggle('active');cy.elements().removeClass('hl dim');if(on){cy.elements().addClass('dim');fn();}}
bUx.onclick=()=>tog(bUx,()=>{const e=cy.edges('[dclass="unindexed"]');e.removeClass('dim');e.connectedNodes().removeClass('dim').addClass('hl');});
bBx.onclick=()=>tog(bBx,()=>{const e=cy.edges('[dclass="broken"]');e.removeClass('dim');e.connectedNodes().removeClass('dim').addClass('hl');});
bOrphan.onclick=()=>tog(bOrphan,()=>{const m=cy.nodes('[?orphan]');m.removeClass('dim').addClass('hl');});
bSup.onclick=()=>tog(bSup,()=>{const m=cy.nodes('[?superseded]');m.removeClass('dim').addClass('hl');});
bFit.onclick=()=>cy.fit(undefined,30); bRelayout.onclick=layout;
let lens=0; const lenses=['both','related','containment'];
bLens.onclick=()=>{lens=(lens+1)%3;const m=lenses[lens];bLens.textContent='edges: '+m;
 cy.edges().removeClass('ehide');
 if(m==='related')cy.edges('[ekind="containment"]').addClass('ehide');
 if(m==='containment')cy.edges('[ekind="related"]').addClass('ehide');};
grp.onchange=()=>{const g=grp.value;cy.elements().removeClass('dim');if(g){cy.elements().addClass('dim');const m=cy.nodes('[group="'+g+'"]');m.removeClass('dim');m.connectedEdges().removeClass('dim').connectedNodes().removeClass('dim');}};
const qa=DATA.qa, P=document.getElementById('qa'); let h='<div class="sub">Click any finding to focus it in the graph.</div>';
function sec(t,arr,c){let s='<h3 class="'+(arr.length?c:'')+'">'+t+' <span>('+arr.length+')</span></h3>';
 if(!arr.length)s+='<div class="item ok">— none —</div>'; else arr.forEach(p=>s+='<div class="item" data-id="'+p.replace(/"/g,'')+'">'+p+'</div>'); return s;}
h+=sec('🟠 Unindexed (on disk — fix index)',qa.unindexed,'warn');
h+=sec('🔴 Broken refs (target missing)',qa.broken,'bad');
let oc=Object.values(qa.orphans).reduce((a,b)=>a+b.length,0);
h+='<h3>⚪ Orphans (no edges) <span>('+oc+')</span></h3>';
Object.keys(qa.orphans).sort().forEach(g=>{h+='<div class="sub">'+g+'</div>';qa.orphans[g].forEach(p=>h+='<div class="item" data-id="'+p.replace(/"/g,'')+'">'+p.split('/').pop()+'</div>');});
h+=sec('⚫ Out-of-scope refs (expected)',qa.out_of_scope,'');
h+=sec('🟣 Superseded',qa.superseded,'');
P.innerHTML=h;
P.querySelectorAll('.item[data-id]').forEach(el=>el.onclick=()=>focus(el.getAttribute('data-id')));
</script></body></html>
